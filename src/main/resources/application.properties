spring.application.name=NexusM

# conexion a MySQL - si tu usuario/clave son distintos, cambialos aca
# el createDatabaseIfNotExist=true hace que cree la base sola la primera vez
spring.datasource.url=jdbc:mysql://localhost:3306/nexusmarket?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=changeme

# ddl-auto=update hace que hibernate cree/actualice las tablas solo,
# a partir de las clases @Entity (para un proyecto de universidad esta bien,
# en un proyecto real se usarian migraciones tipo Flyway)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
