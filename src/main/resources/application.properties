spring.application.name=NexusM

# conexion a MySQL - si tu usuario/clave son distintos, cambialos aca
# el createDatabaseIfNotExist=true hace que cree la base sola la primera vez.
# allowPublicKeyRetrieval=true es necesario junto con useSSL=false: MySQL 8
# usa caching_sha2_password por defecto, y sin SSL el driver necesita permiso
# explicito para pedirle al servidor su llave publica (si no, falla con
# "Public Key Retrieval is not allowed")
spring.datasource.url=jdbc:mysql://localhost:3306/nexusmarket?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=changeme

# ddl-auto=update hace que hibernate cree/actualice las tablas solo,
# a partir de las clases @Entity (para un proyecto de universidad esta bien,
# en un proyecto real se usarian migraciones tipo Flyway)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MongoDB para el audit log (ver Application.adapters.persistence.mongodb) -
# si tu Mongo corre en otro host/puerto o con otro nombre de base, cambialo aca
spring.data.mongodb.uri=mongodb://localhost:27017/nexusmarket_audit

# JWT (ver Rest-security-cors.md). IMPORTANTE: jwt.secret es solo para
# desarrollo/entrega de la tarea - en un proyecto real nunca se sube al
# repositorio, se pone por variable de entorno. tiene que tener al menos
# 32 caracteres (256 bits) porque JwtServiceAdapter firma con HS256
jwt.secret=cambia-este-secreto-por-uno-propio-de-al-menos-32-caracteres
jwt.expiration-ms=3600000
